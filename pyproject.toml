[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sbench"
version = "0.1.0"
description = "Benchmark für Kritische-Szenarien-Suchalgorithmen mit Robustheitsmodul (Sensitivität, Messabweichung, Zeitversatz)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn"]

[project.optional-dependencies]
plot = ["matplotlib"]
dev = ["pytest"]

[project.scripts]
sbench = "sbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
